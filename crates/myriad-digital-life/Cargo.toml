[package]
name = "myriad-digital-life"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure Digital Life Companion domain rules and contracts for Myriad."
authors = ["Myriad Contributors"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
earcutr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[build-dependencies]
serde_json = "1"
