[package]
name = "myriad-nodes"
version = "0.1.0"
edition = "2024"
publish = false
description = "Her nodes from her log: the three kinds, a node's head and body, the tags on what she keeps, the five relations, the row bodies and their fold, the pure half of placing a talk, where a fact she keeps goes, picking nodes for recall, listing all of a kind, the three trust tiers and her intents."
authors = ["Myriad Contributors"]
license = "AGPL-3.0-only"

# Pure: no I/O, no clock, no randomness. Row ids, times and minted keys come
# from the caller. The site links it directly and the shared core
# (`myriad-core-ffi`) links it for every other platform, so the server and
# every computer fold the same node rows into the same nodes.
#
# The first batch of node rules (docs/SHARED_CORE.md「她的节点」): what a
# node is and holds, how its rows fold, and the shape placement returns.
# Her upkeep, wakes, the rules for views and objections come later.
#
# Between host cores (`wire`): base64 for a body's bytes in a batch, and
# the host filter's secret scan as the backstop that keeps a key in one of
# her texts from leaving the device.
[dependencies]
base64 = "0.23"
# Where a fact she keeps goes (`entries`): the placing prompt and how her
# answer is read live in `myriad_merope::topics`, which the settling prompt
# reads too; this crate carries them as node rules. Already below this
# crate (through `myriad-persona-sync`), so no cycle.
myriad-merope = { path = "../myriad-merope" }
# Reading the times in her intents in the zone they were said in: the
# zone rules are compiled in, no clock is read.
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
myriad-perception-filter = { path = "../myriad-perception-filter" }
myriad-persona-log = { path = "../myriad-persona-log" }
myriad-persona-sync = { path = "../myriad-persona-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
